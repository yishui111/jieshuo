<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目二 · 情感解说工作台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#1f232d; --line:#2a2f3a;
    --text:#e8eaf0; --muted:#9aa3b2; --acc:#f59e0b; --acc2:#3b82f6; --ok:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:18px;margin:0}
  .chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .chip{padding:3px 10px;border-radius:20px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
  .chip.ok{color:var(--ok);border-color:var(--ok)}
  .chip.bad{color:var(--bad);border-color:var(--bad)}
  .chip.warn{color:var(--acc);border-color:var(--acc)}
  main{padding:16px 20px 40px;max-width:1280px;margin:0 auto}
  .grid{display:grid;grid-template-columns:minmax(340px,1fr) minmax(380px,1.2fr);gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
  .card h3{font-size:13px;margin:14px 0 8px;color:var(--acc2)}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  textarea,input[type=text],select{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:6px;padding:8px 10px;font:inherit;resize:vertical}
  textarea.small{height:110px}
  input[type=range]{width:100%}
  .btn{display:inline-block;background:var(--acc);border:none;color:#111;font-weight:700;
    padding:9px 18px;border-radius:7px;cursor:pointer;font-size:14px;margin-top:10px}
  .btn.gray{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center}
  .row > *{flex:1}
  .seg{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;background:var(--panel2)}
  .seg .emo{font-size:12px;color:var(--acc);margin-right:8px}
  .seg .txt{white-space:pre-wrap}
  .muted{color:var(--muted);font-size:12px}
  audio{width:100%;margin-top:10px}
  .hide{display:none}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-top-color:transparent;
    border-radius:50%;animation:r 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--acc2);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🎤 项目二 · 情感解说工作台</h1>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="grid">
    <!-- 左列：故事 + 约束文档 -->
    <div>
      <div class="card">
        <h2>① 故事 → 生成激情解说词</h2>
        <textarea id="story" class="small" placeholder="把故事粘进来。例：决赛最后时刻，机器人完成惊天逆转……"></textarea>
        <div class="row">
          <div>
            <label>解说风格</label>
            <select id="style">
              <option>激情解说（足球/电竞赛事解说风格）</option>
              <option>电竞解说</option>
              <option>体育新闻播报</option>
              <option>纪录片解说</option>
              <option>带货激情讲解</option>
            </select>
          </div>
          <div style="max-width:120px">
            <label>时长（秒）</label>
            <select id="duration">
              <option>30</option><option>45</option><option selected>60</option>
              <option>90</option><option>120</option>
            </select>
          </div>
        </div>
        <button class="btn" id="btnGen" onclick="genScript()">生成激情解说词</button>
        <span id="genState" class="muted"></span>
      </div>

      <div class="card">
        <details>
          <summary>约束文档（约束 DeepSeek 输出格式，点开可编辑）</summary>
          <textarea id="constraints" style="height:200px;font-size:12px;margin-top:8px"></textarea>
          <button class="btn gray" onclick="saveConstraints()">保存约束文档</button>
          <span class="muted">保存后，下一条解说词就按新规则生成</span>
        </details>
      </div>
    </div>

    <!-- 右列：解说词 + 朗读 + 历史 -->
    <div>
      <div class="card">
        <h2>② 解说词 → 情感语音</h2>
        <div id="scriptBox"><p class="muted">还没有解说词。先在左侧点「生成激情解说词」。</p></div>

        <div id="synthBox" class="hide">
          <h3>情感声音模型朗读（IndexTTS-2.5）</h3>
          <div class="row">
            <div>
              <label>情绪模式</label>
              <select id="emotionMode" onchange="document.getElementById('presetBox').style.opacity=this.value==='fixed'?1:0.45">
                <option value="auto">跟随解说词每段的情感标注</option>
                <option value="fixed">整段统一使用下面的预设</option>
              </select>
            </div>
            <div id="presetBox" style="opacity:.45">
              <label>情绪预设</label>
              <select id="preset">
                <option selected>激情洋溢</option><option>兴奋</option><option>愤怒</option>
                <option>惊喜</option><option>低落</option><option>平静</option>
              </select>
            </div>
          </div>
          <label>情绪强度 <span id="intenV">0.95</span></label>
          <input type="range" id="intensity" min="0.3" max="1" step="0.05" value="0.95"
                 oninput="document.getElementById('intenV').textContent=this.value">
          <label>语速 <span id="speedV">1.0</span>（大于 1 更快）</label>
          <input type="range" id="speed" min="0.7" max="1.4" step="0.05" value="1"
                 oninput="document.getElementById('speedV').textContent=this.value">
          <button class="btn" id="btnSynth" onclick="synth()">▶ 朗读（激情洋溢）</button>
        </div>

        <div id="jobBox" class="hide" style="margin-top:10px">
          <span class="spin"></span><span id="jobStage"></span>
          <span class="muted" id="jobElapsed"></span>
        </div>
        <div id="audioBox"></div>
      </div>

      <div class="card">
        <h2>最近生成的音频</h2>
        <div id="outputs" class="muted">暂无</div>
      </div>
    </div>
  </div>
</main>

<script>
let currentScript = null, jobTimer = null;
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;");

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.status;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

// ---------- 状态条 ----------
async function refreshStatus() {
  try {
    const s = await api("/api/status");
    const chip = (label, cls) => `<span class="chip ${cls}">${label}</span>`;
    const v = (s.engines||{}).index_tts;
    const [t1, c1] = v === "ready" ? ["✓ 就绪","ok"] : v === "starting" ? ["启动中…","warn"] : ["未启动",""];
    $("chips").innerHTML =
      chip("情感解说引擎 " + t1, c1) +
      chip(s.deepseek_configured ? "DeepSeek ✓" : "DeepSeek 未配置（用本地兜底）", s.deepseek_configured ? "ok" : "warn");
    renderOutputs(s.outputs || []);
  } catch (err) { $("chips").innerHTML = `<span class="chip bad">后端未响应：${esc(err.message)}</span>`; }
}

function renderOutputs(list) {
  if (!list.length) { $("outputs").innerHTML = "暂无"; return; }
  $("outputs").innerHTML = list.map(o =>
    `<div class="row" style="margin-bottom:6px">
       <span style="flex:2"><a href="${o.url}" target="_blank">${esc(o.file)}</a>
       <span class="muted">${o.seconds}s · ${o.time}</span></span>
       <audio controls preload="none" style="flex:3;margin:0" src="${o.url}"></audio>
     </div>`).join("");
}

// ---------- 约束文档 ----------
async function loadConstraints() { $("constraints").value = (await api("/api/constraints")).content; }
async function saveConstraints() {
  await api("/api/constraints", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({content: $("constraints").value})});
  alert("约束文档已保存");
}

// ---------- 解说词 ----------
async function genScript() {
  const btn = $("btnGen");
  btn.disabled = true;
  $("genState").innerHTML = '<span class="spin"></span>生成中（DeepSeek 约 10~60 秒）';
  try {
    const s = await api("/api/gen_script", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({story: $("story").value, style: $("style").value,
        duration: +$("duration").value, extra: ""})});
    currentScript = s;
    renderScript(s);
  } catch (err) { alert("生成失败：" + err.message); }
  btn.disabled = false; $("genState").textContent = "";
}
function renderScript(s) {
  const segs = (s.segments || []).map(x =>
    `<div class="seg"><span class="emo">【${esc(x.emotion)} ${x.intensity}】</span><span class="txt">${esc(x.text)}</span></div>`).join("");
  $("scriptBox").innerHTML = `<b>《${esc(s.title)}》</b>
    <span class="muted">（${s.segments.length} 段${s._notice ? " · " + esc(s._notice) : ""}）</span>
    <div style="margin-top:8px">${segs}</div>`;
  $("synthBox").classList.remove("hide");
}

// ---------- 合成（异步任务） ----------
async function synth() {
  if (!currentScript) { alert("请先生成解说词"); return; }
  if (jobTimer) { alert("已有合成任务在进行，请等它结束"); return; }
  const btn = $("btnSynth");
  btn.disabled = true;
  $("jobBox").classList.remove("hide");
  $("audioBox").innerHTML = "";
  try {
    const {job_id} = await api("/api/synth", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({script: currentScript, preset: $("preset").value,
        emotion_mode: $("emotionMode").value, intensity: +$("intensity").value, speed: +$("speed").value})});
    jobTimer = setInterval(async () => {
      let job;
      try { job = await api(`/api/job/${job_id}`); } catch (e) { return; }
      $("jobStage").textContent = job.stage || "";
      $("jobElapsed").textContent = job.done ? "" : `（已进行 ${job.elapsed} 秒）`;
      if (job.done) {
        clearInterval(jobTimer); jobTimer = null;
        btn.disabled = false; $("jobBox").classList.add("hide");
        if (job.error) { alert("合成失败：" + job.error + "。可直接再点一次朗读重试。"); return; }
        $("audioBox").innerHTML =
          `<h3>成片：${esc(job.result.file)}（${job.result.seconds}s）</h3>
           <audio controls autoplay src="${job.result.url}"></audio>`;
        refreshStatus();
      }
    }, 2000);
  } catch (err) {
    btn.disabled = false; $("jobBox").classList.add("hide");
    alert("提交合成失败：" + err.message);
  }
}

// ---------- 启动 ----------
loadConstraints();
refreshStatus();
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
