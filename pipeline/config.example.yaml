# 解说流水线配置
# 说明：
#  - deepseek.api_key 优先从这里读；留空则读环境变量 DEEPSEEK_API_KEY
#  - 没有DeepSeek key 时自动回退到本地 Ollama 生成解说词（效果稍弱，便于离线试用）

tts:
  server: "http://127.0.0.1:9602"          # index-tts/tts_server.py 的地址
  spk_audio: "../index-tts/asset/zero_shot_prompt.wav"   # 音色参考（换成任意3~10秒人声即可换音色）
  lang: "zh_CN"
  interval_silence_ms: 260                  # 段与段之间的停顿
  timeout_s: 600                            # 单段合成超时（首次合成含预热会较慢）

deepseek:
  api_base: "https://api.deepseek.com/v1"
  api_key: ""                               # 在这里填你的 DeepSeek API Key
  model: "deepseek-chat"
  temperature: 1.3
  timeout_s: 180
  fallback_ollama:                          # key 为空/调用失败时的本地兜底
    enabled: true
    host: "http://127.0.0.1:11434"
    model: "qwen3.5:4b"   # 16GB 显存建议 4b（与 TTS 服务共存）；显存充裕可换 qwen3:14b

video:
  max_frames: 10                            # 最多抽多少帧给视觉模型看
  frame_width: 768                          # 抽帧缩放宽度（省显存/带宽）
  vlm_model: "qwen3-vl:8b"                  # Ollama 里的视觉模型（ollama pull qwen3-vl:8b）
  vlm_timeout_s: 300

output:
  dir: "../解说音频"                         # 最终音频与解说词的输出目录（相对 pipeline/）
