# 项目一 · 专属声音 工作台配置
# 说明：
#  - deepseek.api_key 在这里填；留空则读环境变量 DEEPSEEK_API_KEY
#  - 没有 DeepSeek key 时自动回退本地 Ollama 生成解说词
#  - 本文件即 config.yaml 的模板；首次部署复制为 config.yaml 即可

deepseek:
  api_base: "https://api.deepseek.com/v1"
  api_key: ""                               # ← 在这里填你的 DeepSeek API Key
  model: "deepseek-chat"
  temperature: 1.3
  timeout_s: 180
  fallback_ollama:
    enabled: true
    host: "http://127.0.0.1:11434"
    model: "qwen2.5:7b-16k"                 # 本机 Ollama 里已有的模型

workbench:
  host: "127.0.0.1"
  port: 9610

engines:
  gpt_sovits:                               # 专属声音引擎（GPT-SoVITS 训练+推理）
    label: "专属声音引擎 GPT-SoVITS"
    cmd: ".venv/Scripts/python.exe api_server.py -a 127.0.0.1 -p 9885"
    cwd: "GPT-SoVITS"
    health: "http://127.0.0.1:9885/health"

tts:
  gpt_sovits:
    text_lang: "zh"
    prompt_lang: "zh"
    timeout_s: 600
    # 还没训练专属声音时的默认参考音频（零样本克隆音色）；训练完成后自动改用专属声音
    default_ref_audio: "GPT-SoVITS/参考音频/解说员_默认参考.wav"
    default_prompt_text: "希望你以后能够做的比我还好呦。"

training:
  default_exp_name: "我的解说声音"
  sovits_epochs: 12
  gpt_epochs: 15
  sovits_batch_size: 6
  gpt_batch_size: 12
  save_every_epoch: 4

paths:
  materials_dir: "训练素材"                  # ← 把你的激情解说录音放这里
  outputs_dir: "解说音频"                    # 生成音频的保存位置（本项目\解说音频）
  model_cache_dir: "model_cache"            # HF/ModelScope 缓存本地化（不占C盘）
  voice_config: "voice_config.json"         # 当前启用的专属声音（训练完成后写入）
